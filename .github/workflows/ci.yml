name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Xray-dependent tests skip themselves when no binary is available.
      - run: pytest
      - run: bash -n deploy/install.sh deploy/attach-domain.sh deploy/on-burn.example.sh deploy/publish-control.example.sh deploy/settle-provider.example.sh
