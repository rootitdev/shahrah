name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Vendored panel UIs under deploy/panels/ are not linted here (upstream style).
      - run: ruff check src tests
      - run: ruff format --check src tests
      # Xray-dependent tests skip themselves when no binary is available.
      - run: pytest
      - run: bash -n deploy/install.sh deploy/uninstall-shahrah.sh deploy/shahrah-wizard.sh deploy/rollback-install.sh deploy/beta/germany-exit-install.sh deploy/beta/germany-attach-waterwall.sh deploy/beta/iran-relay-install.sh deploy/beta/migrate-exit-public-ip.sh deploy/beta/firewall-germany-beta.sh deploy/beta/firewall-iran-relay.sh deploy/beta/stability-check.sh deploy/install-panels.sh deploy/install-rootit.sh deploy/attach-domain.sh deploy/on-burn.example.sh deploy/publish-control.example.sh deploy/settle-provider.example.sh deploy/panels/ig-mult-web/install.sh deploy/panels/settle-web/install.sh deploy/panels/sni-watch/install.sh deploy/panels/lib/panel_install_lib.sh scripts/check_lt_before_publish.sh scripts/package-beta-release.sh scripts/backup-state-local-test.sh scripts/backup-shahrah-bundle.sh scripts/restore-shahrah-drill.sh
